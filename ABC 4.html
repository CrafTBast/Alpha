<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Direct-Typing Notepad</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1e1e1e;
            color: #00ff00;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        h1 {
            color: #ffffff;
            margin-bottom: 5px;
            font-size: 24px;
        }
        p {
            color: #888;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            width: 90%;
            max-width: 1200px;
            margin-bottom: 20px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: bold;
            background-color: #2d2d2d;
            border: 2px solid #00ff00;
            color: #00ff00;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background-color: #00ff00;
            color: #1e1e1e;
        }
        .btn:active {
            transform: scale(0.99);
        }
        /* The entire screen functions as a live terminal canvas */
        #canvasArea {
            width: 90%;
            max-width: 1200px;
            flex-grow: 1;
            padding: 30px;
            background-color: #000000;
            border: 2px solid #333;
            border-radius: 8px;
            white-space: pre; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 12px; 
            line-height: 1.1; 
            letter-spacing: 0px;
            overflow-y: auto;
            overflow-x: auto;
            cursor: text;
            outline: none;
        }
        #canvasArea:focus {
            border-color: #00ff00;
        }
        /* Custom retro blinking cursor styling */
        .cursor {
            background-color: #00ff00;
            color: #000000;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            50% { background-color: transparent; color: inherit; }
        }
    </style>
</head>
<body>

    <h1>Classic Direct Notepad</h1>
    <p>Click inside the black canvas below and just start typing. No input box needed!</p>

    <div class="btn-container">
        <button class="btn" id="copyBtn">Copy Art</button>
        <button class="btn" id="clearBtn">Clear Canvas</button>
    </div>

    <!-- This container catches focus and acts as the direct viewport -->
    <div id="canvasArea" tabindex="0"></div>

    <script>
        const alphabet = {
            'A': ["    _    ", "   / \\   ", "  / _ \\  ", " / ___ \\ ", "/_/   \\_\\", "         "],
            'B': [" ____   ", "| __ )  ", "|  _ \\  ", "| |_) | ", "|____/  ", "        "],
            'C': ["  ____  ", " / ___| ", "| |     ", "| |___  ", " \\____| ", "        "],
            'D': [" ____   ", "|  _ \\  ", "| | | | ", "| | | | ", "|____/  ", "        "],
            'E': [" _____  ", "| ____| ", "|  _|   ", "| |___  ", "|_____| ", "        "],
            'F': [" _____  ", "|  ___| ", "| |_    ", "|  _|   ", "|_|     ", "        "],
            'G': ["  ____  ", " / ___| ", "| |  _  ", "| |_| | ", " \\____| ", "        "],
            'H': [" _   _  ", "| |_| | ", "|  _  | ", "| | | | ", "|_| |_| ", "        "], // Compressed shape
            'I': [" ___ ", "|_ _|", " | | ", " | | ", "|___|", "     "],
            'J': ["     _  ", "    | | ", " _  | | ", "| |_| | ", " \\___/  ", "        "],
            'K': [" _  __  ", "| |/ /  ", "| ' /   ", "| . \\   ", "|_|\\_\\  ", "        "],
            'L': [" _      ", "| |     ", "| |     ", "| |___  ", "|_____| ", "        "], // Compressed shape
            'M': [" __  __ ", "|  \\/  |", "| |\\/| |", "| |  | |", "|_|  |_|", "        "],
            'N': [" _   _  ", "| \\ | | ", "|  \\| | ", "| |\\  | ", "|_| \\_| ", "        "], // Compressed shape
            'O': ["  ____  ", " / __ \\ ", "| |  | |", "| |  | |", " \\____/ ", "        "],
            'P': [" ____   ", "|  _ \\  ", "| |_) | ", "|  __/  ", "|_|     ", "        "],
            'Q': ["  ___   ", " / _ \\  ", "| | | | ", "| |_| | ", " \\__\\_\\ ", "        "],
            'R': [" ____   ", "|  _ \\  ", "| |_) | ", "|  _ <  ", "|_| \\_\\ ", "        "],
            'S': [" ____   ", "/ ___|  ", "\\___ \\  ", " ___) | ", "|____/  ", "        "],
            'T': [" _____  ", "|_   _| ", "  | |   ", "  | |   ", "  |_|   ", "        "],
            'U': [" _   _  ", "| | | | ", "| | | | ", "| |_| | ", " \\___/  ", "        "],
            'V': [" _   _  ", "| | | | ", "| | | | ", " \\_ _/  ", "  \\_/   ", "        "],
            'W': ["__        __", "\\ \\      / /", " \\ \\ /\\ / / ", "  \\ V  V /  ", "   \\_/\\_/   ", "            "],
            'X': [" __  __ ", " \\ \\/ / ", "  \\  /  ", "  /  \\  ", " /_/\\_\\ ", "        "],
            'Y': [" __   __", " \\ \\ / /", "  \\ V / ", "   | |  ", "   |_|  ", "        "],
            'Z': [" _____  ", "|__  /  ", "  / /   ", " / /_   ", "/____|  ", "        "],
            ' ': ["      ", "      ", "      ", "      ", "      ", "      "],
            // Numbers 0-9 matching the clean 5-row height format
            '0': ["  ___  ", " / _ \\ ", "| | | |", "| |_| |", " \\___/ ", "       "],
            '1': [" _ ", "/ |", "| |", "| |", "|_|", "   "],
            '2': [" ____  ", "|___ \\ ", "  __) |", " / __/ ", "|_____|", "       "],
            '3': [" _____ ", "|___ / ", "  |_ \\ ", " ___) |", "|____/ ", "       "],
            '4': [" _  _   ", "| || |  ", "| || |_ ", "|__   _|", "   |_|  ", "        "],
            '5': [" ____  ", "| ___| ", "|___ \\ ", " ___) |", "|____/ ", "       "],
            '6': ["  __   ", " / /_  ", "| '_ \\ ", "| (_) |", " \\___/ ", "       "],
            '7': [" _____ ", "|___  |", "   / / ", "  / /  ", " /_/   ", "       "],
            '8': ["  ___  ", " / _ \\ ", "| (_) |", " > _ < ", " \\___/ ", "       "],
            '9': ["  ___  ", " / _ \\ ", "| (_) |", " \\__, |", "   /_/ ", "       "],
            // Punctuation Support
            '.': ["    ", "    ", "    ", "    ", " [] ", "    "],
            ',': ["    ", "    ", "    ", " [] ", " /  ", "    "],
            '!': ["  _  ", " | | ", " | | ", " |_| ", " (_) ", "     "],
            '?': ["  ___  ", " / _ \\ ", "| | | |", "  / /  ", " |_|   ", " (_)   "],
            '-': ["      ", "      ", " ---- ", "      ", "      ", "      "],
            '+': ["      ", "   +  ", " -----", "   +  ", "      ", "      "],
            '=': ["      ", " ==== ", "      ", " ==== ", "      ", "      "],
            ':': ["    ", " [] ", "    ", " [] ", "    ", "    "],
            ';': ["    ", " [] ", "    ", " [] ", " /  ", "    "],
            '/': ["    / ", "   /  ", "  /   ", " /    ", "/     ", "      "],
            '"': [" \"\" ", " \"\" ", "    ", "    ", "    ", "    "],
            "'": ["  ' ", "  ' ", "    ", "    ", "    ", "    "]
        };



        const canvasArea = document.getElementById('canvasArea');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');

        // Internal raw memory array to hold your multi-line typed string data strings
        let rawLines = [""]; 
        const maxRows = 6;

        // Automatically snap focus to the typing canvas on browser load
        canvasArea.focus();

        function renderCanvas() {
            if (rawLines.length === 1 && rawLines[0].length === 0) {
                // If the entire layout is empty, draw a baseline cursor hook
                canvasArea.innerHTML = '<span class="cursor">&nbsp;</span>';
                return;
            }

            let grandBlocks = [];

            rawLines.forEach((lineText, blockIndex) => {
                let textRows = Array(maxRows).fill("");

                for (let char of lineText) {
                    let activeChar = alphabet[char] || Array(maxRows).fill("      ");
                    for (let i = 0; i < maxRows; i++) {
                        textRows[i] += activeChar[i];
                    }
                }

                // If this is the active block line currently being typed on, inject the blinking cursor structure
                if (blockIndex === rawLines.length - 1) {
                    // Attach cursor highlight parameter blocks down the side of row segments
                    textRows[0] += '<span class="cursor"> </span>';
                    textRows[1] += '<span class="cursor"> </span>';
                    textRows[2] += '<span class="cursor"> </span>';
                    textRows[3] += '<span class="cursor"> </span>';
                    textRows[4] += '<span class="cursor"> </span>';
                    textRows[5] += ' ';
                }

                grandBlocks.push(textRows.join('\n'));
            });

            canvasArea.innerHTML = grandBlocks.join('\n\n');
            // Auto scroll container down to trace typing position
            canvasArea.scrollTop = canvasArea.scrollHeight;
        }

        // Intercept global keyboard clicks directly when focused
        canvasArea.addEventListener('keydown', (e) => {
            let activeLineIndex = rawLines.length - 1;

            if (e.key === 'Backspace') {
                e.preventDefault();
                if (rawLines[activeLineIndex].length > 0) {
                    // Erase last letter
                    rawLines[activeLineIndex] = rawLines[activeLineIndex].slice(0, -1);
                } else if (rawLines.length > 1) {
                    // If line is empty, pop back up to previous row block
                    rawLines.pop();
                }
                renderCanvas();
            } 
            else if (e.key === 'Enter') {
                e.preventDefault();
                // Start a brand new lines block underneath
                rawLines.push("");
                renderCanvas();
            } 
            else if (e.key.length === 1) {
                e.preventDefault();
                let charTyped = e.key.toUpperCase();
                // Append key value to data stream if it exists in our dictionary
                if (alphabet[charTyped]) {
                    rawLines[activeLineIndex] += charTyped;
                    renderCanvas();
                }
            }
        });

// Copy Engine: Generates a temporary string representation minus HTML cursor components
copyBtn.addEventListener('click', () => {
    if (rawLines.length === 1 && rawLines[0].length === 0) {
        alert("Nothing to copy! Please type some text first.");
        return;
    }

    let textOutput = [];
    rawLines.forEach(lineText => {
        let rows = Array(maxRows).fill("");
        for (let char of lineText) {
            let activeChar = alphabet[char] || Array(maxRows).fill("      ");
            for (let i = 0; i < maxRows; i++) {
                rows[i] += activeChar[i];
            }
        }
        textOutput.push(rows.join('\n'));
    });

    navigator.clipboard.writeText(textOutput.join('\n\n')).then(() => {
        const prevLabel = copyBtn.textContent;
        copyBtn.textContent = "Copied! ✓";
        setTimeout(() => copyBtn.textContent = prevLabel, 1500);
    });
    canvasArea.focus();
});

// Clear Canvas routine
clearBtn.addEventListener('click', () => {
    rawLines = [""];
    renderCanvas();
    canvasArea.focus();
});

// Force focus if the user clicks inside the canvas area boundary box
canvasArea.addEventListener('click', () => canvasArea.focus());

// Initial launch drawing trigger
renderCanvas();


</script>
</body>
</html>
