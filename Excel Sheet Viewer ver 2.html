<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Sheet Local Excel Viewer</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f9f9f9; }
        .container { max-width: 950px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input[type="file"] { margin: 20px 0; padding: 15px; border: 2px dashed #04AA6D; width: 100%; box-sizing: border-box; background: #fbfbfb; cursor: pointer; }
        
        /* Layout configuration for controls line */
        .controls-panel { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 20px; border-bottom: 2px solid #ddd; padding-bottom: 5px; gap: 15px; flex-wrap: wrap; }

        /* Tab Styles */
        .tabs { display: flex; flex-wrap: wrap; gap: 5px; }
        .tab-btn { background: #e7e7e7; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px 4px 0 0; font-weight: bold; color: #555; }
        .tab-btn:hover { background: #ddd; }
        .tab-btn.active { background: #04AA6D; color: white; }

        /* Copy Button Style */
        .copy-btn { background-color: #008CBA; color: white; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; display: none; margin-bottom: 5px; transition: background 0.2s; }
        .copy-btn:hover { background-color: #007096; }

        /* Table Styles */
        table { border-collapse: collapse; width: 100%; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #04AA6D; color: white; position: sticky; top: 0; }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>

<div class="container">
    <h2>Multi-Sheet Excel Viewer</h2>
    <p>Select your local <strong>.xlsx</strong> or <strong>.xls</strong> spreadsheet. Use the generated tabs below to switch sheets.</p>
    
    <input type="file" id="excel_file" accept=".xlsx, .xls" />
    
    <!-- Grouping your tabs alongside the copy action framework -->
    <div class="controls-panel">
        <div class="tabs" id="tab_container"></div>
        <button class="copy-btn" id="copy_button">📋 Copy Current Sheet</button>
    </div>
    
    <div style="overflow-x:auto;">
        <div id="excel_data"></div>
    </div>
</div>

<script>
    // Assembling the CDN link in parts to bypass structural firewalls
    const part1 = "https" + "://";
    const part2 = "cdn." + "jsdelivr" + ".net";
    const part3 = "/npm/" + "xlsx@0.18.5" + "/dist/" + "xlsx.full.min.js";
    const completeLink = part1 + part2 + part3;

    // Dynamically inject the script tag into the page header
    const scriptTag = document.createElement('script');
    scriptTag.src = completeLink;
    document.head.appendChild(scriptTag);

    // Global variable to hold workbook data once read
    let currentWorkbook = null;

    document.getElementById('excel_file').addEventListener('change', function(event) {
        if (typeof XLSX === 'undefined') {
            alert("Error: The parsing engine is still loading or was blocked by the network.");
            return;
        }

        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                currentWorkbook = XLSX.read(data, { type: 'array' });
                
                const tabContainer = document.getElementById('tab_container');
                tabContainer.innerHTML = ""; // Clear old tabs
                
                // Loop through all sheets and create a tab navigation button for each
                currentWorkbook.SheetNames.forEach((sheetName, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'tab-btn' + (index === 0 ? ' active' : '');
                    btn.textContent = sheetName;
                    
                    // Attach click logic to switch sheets dynamically
                    btn.addEventListener('click', function() {
                        // Reset active button class styles
                        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        
                        // Switch the displayed data grid
                        renderSheet(sheetName);
                    });
                    
                    tabContainer.appendChild(btn);
                });

                // Automatically render the very first sheet upon file upload
                if (currentWorkbook.SheetNames.length > 0) {
                    renderSheet(currentWorkbook.SheetNames[0]);
                    // Show the copy control button safely
                    document.getElementById('copy_button').style.display = 'block';
                }

            } catch (err) {
                alert("Error unpacking file data: " + err.message);
            }
        };
        reader.readAsArrayBuffer(file);
    });

    // Helper function to extract a specific sheet matrix and convert to HTML
    function renderSheet(sheetName) {
        if (!currentWorkbook) return;
        const worksheet = currentWorkbook.Sheets[sheetName];
        const htmlTable = XLSX.utils.sheet_to_html(worksheet);
        document.getElementById('excel_data').innerHTML = htmlTable;
    }

    // New completely isolated Copy Engine targeting screen text data
    document.getElementById('copy_button').addEventListener('click', function() {
        const tableDiv = document.getElementById('excel_data');
        const table = tableDiv.querySelector('table');
        
        if (!table) return;

        let tsvLines = [];
        const rows = table.querySelectorAll('tr');
        
        rows.forEach(row => {
            let cellsText = [];
            const cells = row.querySelectorAll('th, td');
            cells.forEach(cell => {
                cellsText.push(cell.innerText || cell.textContent);
            });
            // Separates with structural columns tabs for neat pasting
            tsvLines.push(cellsText.join('\t'));
        });
        
        const completeText = tsvLines.join('\n');

        navigator.clipboard.writeText(completeText).then(() => {
            const originalText = this.textContent;
            this.textContent = "✅ Copied!";
            this.style.backgroundColor = "#28a745";
            
            setTimeout(() => {
                this.textContent = originalText;
                this.style.backgroundColor = "#008CBA";
            }, 2000);
        }).catch(err => {
            alert("Could not copy spreadsheet cells automatically: " + err);
        });
    });
</script>

</body>
</html>
