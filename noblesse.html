function loadPrecompiledList() {
    if (!MY_EMBEDDED_TEXT_LIST || !MY_EMBEDDED_TEXT_LIST.trim()) {
        console.log("[Preloader Engine] Embedded text block is empty. Skipping auto-load.");
        return;
    }

    const container = document.getElementById('file-list-container');
    if (!container) return;
    container.innerHTML = '';

    // Split text cleanly by lines, cleaning out tabs and white space margins
    loadedUrls = MY_EMBEDDED_TEXT_LIST.split('\n')
        .map(line => line.replace(/\t/g, ' ').trim())
        .filter(line => line.length > 0);

    if (loadedUrls.length === 0) return;

    console.log(`[Preloader Engine] Instantly loading ${loadedUrls.length} preloaded assets into sidebar...`);
    renderSidebarLinks();
}


function generateFileList() {
    const textarea = document.getElementById('bulk-inputs');
    const container = document.getElementById('file-list-container');
    container.innerHTML = '';
    
    const rawInput = textarea.value;
    loadedUrls = [];

    if (!rawInput.trim()) {
        container.innerHTML = 'No URLs added yet.';
        currentIndex = -1;
        updateControlButtons();
        return;
    }

    const lines = rawInput.split('\n').map(line => line.trim()).filter(line => line.length > 0);

    // --- STRATEGY DETECTOR PIPELINE ---
    let isPrecompiledUrlList = true;
    for (let line of lines) {
        if (line.toLowerCase().includes('jsdelivr.com') || (!line.startsWith('http') && !line.startsWith('data:'))) {
            isPrecompiledUrlList = false;
            break;
        }
    }

    if (isPrecompiledUrlList) {
        // === MODE 1: NATIVE OLD CODE BEHAVIOUR (Pre-made URLs List) ===
        console.log("[Parser Engine] Running in Backwards-Compatible Mode (Clean URL List detected)");
        loadedUrls = lines;
    } else {
        // === MODE 2: SELF-SENSING CDN EXTRACTOR ENGINE (Raw Web Text Dumps) ===
        console.log("[Parser Engine] Running in Extractor Mode (Messy Web Text Dump detected)");
        
        const targetCdnDomain = "https://cdn.jsdelivr.net/gh/";
        let isolatedUserRepo = "";   
        let isolatedBranch = "main"; 

        // Pass A: Extract repo user, repo name and branch modifiers cleanly
        for (let i = 0; i < lines.length; i++) {
            let cleanLine = lines[i];

            if (cleanLine.toLowerCase().includes('jsdelivr.com')) {
                let marker = 'gh/';
                let markerPos = cleanLine.toLowerCase().indexOf(marker);
                
                if (markerPos === -1 && cleanLine.toLowerCase().includes('/package/')) {
                    marker = '/package/gh/';
                    markerPos = cleanLine.toLowerCase().indexOf(marker);
                }

                if (markerPos !== -1) {
                    let remainingText = cleanLine.substring(markerPos + marker.length).trim();
                    let boundaries = [' ', '"', "'", '?', '#'];
                    for (let boundary of boundaries) {
                        let idx = remainingText.indexOf(boundary);
                        if (idx !== -1) remainingText = remainingText.substring(0, idx);
                    }

                    if (remainingText.endsWith('/')) {
                        remainingText = remainingText.substring(0, remainingText.length - 1);
                    }
                    
                    let pathSegments = remainingText.split('/');
                    if (pathSegments.length >= 2) {
                        isolatedUserRepo = pathSegments[0] + '/' + pathSegments[1];
                    }
                }
            }

            if (cleanLine.includes('@') && !cleanLine.toLowerCase().includes('http')) {
                let segments = cleanLine.split('@');
                if (segments.length >= 2) {
                    let candidateBranch = segments[1].trim();
                    let spaceIdx = candidateBranch.indexOf(' ');
                    if (spaceIdx !== -1) {
                        candidateBranch = candidateBranch.substring(0, spaceIdx);
                    }
                    isolatedBranch = candidateBranch;
                }
            }
        }

        // Pass B: Loop through and stitch naked filename entries using tab separation rules
        if (isolatedUserRepo) {
            lines.forEach(line => {
                let normalizedLower = line.toLowerCase();
                if (
                    normalizedLower.startsWith('http') || 
                    line.startsWith('©') || 
                    line.includes('@') ||
                    normalizedLower.includes('cdn files') ||
                    normalizedLower.includes('hits badge') ||
                    normalizedLower.includes('toggle navigation') ||
                    normalizedLower.startsWith('- ') ||
                    normalizedLower.includes('looking for a nice landing page') ||
                    normalizedLower.includes('documentation') ||
                    normalizedLower.includes('learn more about')
                ) {
                    return;
                }

                // Isolate file using literal tab characters (\t) to keep full file name spaces intact
                let lineTokens = line.split('\t');
                let filename = lineTokens[0] ? lineTokens[0].trim() : "";

                let lowerFile = filename.toLowerCase();
                if (lowerFile === 'readme.md' || filename === '.' || filename === '..' || !filename) {
                    return;
                }

                let completeCdnUrl = targetCdnDomain + isolatedUserRepo + "@" + isolatedBranch + "/" + filename;
                loadedUrls.push(completeCdnUrl);
            });
        }
    }

    // Instantly remove matching duplicate entries
    loadedUrls = [...new Set(loadedUrls)];

    if (loadedUrls.length === 0) {
        container.innerHTML = 'No URLs or valid file paths parsed yet.';
        currentIndex = -1;
        updateControlButtons();
        return;
    }

    renderSidebarLinks();
}


// FIXED: Streamlined, unified renderer completely free of array vs string .substring() crashes
function renderSidebarLinks() {
    const container = document.getElementById('file-list-container');
    container.innerHTML = '';

    loadedUrls.forEach((url, index) => {
        let displayTitle = "";
        
        if (url.startsWith('data:')) {
            displayTitle = `Data Stream #${index + 1}`;
        } else if (url.startsWith('http://') || url.startsWith('https://')) {
            // Safely isolate the string first, dropping tracking queries cleanly
            let cleanStringUrl = url.split('?')[0];
            let lastSlash = cleanStringUrl.lastIndexOf('/');
            
            displayTitle = lastSlash !== -1 
                ? decodeURIComponent(cleanStringUrl.substring(lastSlash + 1)) 
                : `File #${index + 1}`;
        } else {
            displayTitle = url.length > 25 ? url.substring(0, 22) + "..." : url;
        }

        const link = document.createElement('a');
        link.className = 'file-link';
        link.id = `file-link-${index}`;
        link.innerText = displayTitle;
        link.title = url; 
        link.onclick = function() { selectFile(index); };
        container.appendChild(link);
    });

    currentIndex = -1;
    if (typeof updateControlButtons === 'function') {
        updateControlButtons();
    }
}







function selectFile(index) {
    if (index < 0 || index >= loadedUrls.length) return;
    currentIndex = index;
    const url = loadedUrls[currentIndex];
    let fileName = url.substring(url.lastIndexOf('/') + 1) || url;
    document.querySelectorAll('.file-link').forEach(el => el.classList.remove('active'));
    const activeLink = document.getElementById(`file-link-${currentIndex}`);
    if (activeLink) {
        activeLink.classList.add('active');
        activeLink.scrollIntoView({ block: 'nearest' });
    }
    fetchFileContent(url, fileName);
}


// === SELF-HEALING RECOVERY CONFIGURATION ===
let prefetchRetryCount = 0;
const MAX_PREFETCH_RETRIES = 3;
const RETRY_DELAY_MS = 3000; // 3 seconds spacing

function prefetchNextFile() {
    const isShuffleActive = document.getElementById('chk-shuf')?.checked;

    // Stop if shuffle is on, list is empty, or we are at the end
    if (isShuffleActive || loadedUrls.length <= 1 || currentIndex === -1) {
        return;
    }

    const nextIndex = currentIndex + 1;

    if (nextIndex < loadedUrls.length) {
        const nextUrl = loadedUrls[nextIndex];

        // Skip downloading if we already have it cached cleanly
        if (fileCache[nextUrl]) {
            prefetchRetryCount = 0; // Reset counter since this file is good
            return;
        }

        // Apply cache-buster timestamp to force jsDelivr to evaluate clean CORS headers
        const cacheBusterUrl = nextUrl.includes('?') 
            ? `${nextUrl}&_cb=${Date.now()}` 
            : `${nextUrl}?_cb=${Date.now()}`;

        console.log(`[Prefetch Engine] Attempting to fetch: ${nextUrl.substring(nextUrl.lastIndexOf('/') + 1)} (Attempt ${prefetchRetryCount + 1})`);

        fetch(cacheBusterUrl)
            .then(response => {
                if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
                return response.text();
            })
            .then(rawText => {
                // Double check it's not a generic jsDelivr HTML error page masked as text
                if (rawText.includes('<!DOCTYPE html>') || rawText.includes('<html')) {
                    throw new Error("CDN returned an HTML error page instead of raw data.");
                }

                fileCache[nextUrl] = rawText.trim(); // Store cleanly in memory
                console.log("[Prefetch Success] Cached: " + nextUrl.substring(nextUrl.lastIndexOf('/') + 1));
                
                prefetchRetryCount = 0; // Reset counter for the next files down the line
            })
            .catch((error) => {
                console.warn(`[Prefetch CORS/Network Block] Encountered an error for: ${nextUrl.substring(nextUrl.lastIndexOf('/') + 1)}`, error);

                if (prefetchRetryCount < MAX_PREFETCH_RETRIES) {
                    prefetchRetryCount++;
                    console.log(`[Prefetch Recovery] CORS block or Sync Delay detected. Retrying file in ${RETRY_DELAY_MS / 1000} seconds...`);
                    
                    // Call itself again after a delay to wake up the engine
                    setTimeout(() => {
                        prefetchNextFile();
                    }, RETRY_DELAY_MS);
                } else {
                    console.error(`[Prefetch Aborted] Failed after ${MAX_PREFETCH_RETRIES} attempts. Skipping prefetch for this file to save resources.`);
                    prefetchRetryCount = 0; // Reset counter so the next file change can trigger a fresh cycle
                }
            });
    }
}


function fetchFileContent(url, fileName) {
    const titleEl = document.getElementById('current-title');
    const txtView = document.getElementById('text-renderer');
    const imgBox = document.getElementById('image-container');
    const audioBox = document.getElementById('audio-container');
    const audioPlayer = document.getElementById('audio-element');
    
    audioPlayer.pause();
    audioPlayer.src = "";
    imgBox.style.display = "none";
    audioBox.style.display = "none";
    txtView.style.display = "block";
    titleEl.innerText = fileName;
    
    updateControlButtons();

    // ⚡ THE CACHE CHECK: If the prefetch engine already downloaded it, use it instantly!
    if (window.fileCache && fileCache[url]) {
        console.log(`[Cache Hit] Serving "${fileName}" instantly from memory cache. 0ms delay.`);
        processFileContents(fileCache[url]);
        return; // Stop right here! Do not trigger a network fetch.
    }

    // 🌐 Fallback: If it's not cached yet, display loading text and run a live download
    txtView.innerHTML = 'Loading file data...';
    
    fetch(url).then(response => {
        if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
        return response.text();
    }).then(rawText => {
        processFileContents(rawText.trim());
    }).catch(error => {
        txtView.innerHTML = '<span class="error"> <strong>Failed to load file.</strong><br><br> Possible issues:<br> 1. The URL is broken or typed wrong.<br> 2. <strong>CORS block:</strong> The server hosting your files might be blocking outside websites from reading them. </span>';
        console.error(error);
    });
}


function processFileContents(cleanText) {
    const txtView = document.getElementById('text-renderer');
    const imgBox = document.getElementById('image-container');
    const imgEl = document.getElementById('img-element');
    const audioBox = document.getElementById('audio-container');
    const audioPlayer = document.getElementById('audio-element');
    let processedSrc = cleanText;
    let isImage = /^data:image\/(png|jpeg|jpg|webp|gif|svg\+xml);base64,/.test(cleanText);
    let isAudio = /^data:audio\/(mp3|wav|ogg|mpeg|webm|x-wav|aac);base64,/.test(cleanText);
    if (!isImage && !isAudio) {
        const startingChars = cleanText.substring(0, 12);
        if (startingChars.startsWith("SUQz") || startingChars.startsWith("//M0") || startingChars.startsWith("//MY")) {
            processedSrc = "data:audio/mp3;base64," + cleanText;
            isAudio = true;
        } else if (startingChars.startsWith("UklGR")) {
            processedSrc = "data:audio/wav;base64," + cleanText;
            isAudio = true;
        } else if (startingChars.startsWith("iVBORw0KGgo")) {
            processedSrc = "data:image/png;base64," + cleanText;
            isImage = true;
        } else if (startingChars.startsWith("/9j/")) {
            processedSrc = "data:image/jpeg;base64," + cleanText;
            isImage = true;
        } else if (startingChars.startsWith("R0lGOD")) {
            processedSrc = "data:image/gif;base64," + cleanText;
            isImage = true;
        } else if (startingChars.startsWith("UklGR") && cleanText.includes("WEBP")) {
            processedSrc = "data:image/webp;base64," + cleanText;
            isImage = true;
        }
    }
    if (isImage) {
        txtView.style.display = "none";
        imgBox.style.display = "flex";
        imgEl.src = processedSrc;
        txtView.textContent = cleanText;
    } else if (isAudio) {
        txtView.style.display = "none";
        audioBox.style.display = "flex";
        audioPlayer.src = processedSrc;
        txtView.textContent = cleanText;
        if (document.getElementById('chk-autoplay').checked) {
            audioPlayer.play().catch(e => console.log("Playback interaction flag block logged."));
        }
    } else {
        txtView.textContent = cleanText;
    }
    updateControlButtons();
    prefetchNextFile(); 
}

function handleAudioTrackEnded() {
    if (document.getElementById('chk-autonext').checked) {
        if (document.getElementById('chk-shuf').checked) {
            executeShuffleStep();
        } else {
            navigateFile(1);
        }
    }
}

function executeShuffleStep() {
    if (loadedUrls.length <= 1) return;
    if (playedIndicesHistory.length >= loadedUrls.length) {
        playedIndicesHistory = [];
    }
    if (!playedIndicesHistory.includes(currentIndex)) {
        playedIndicesHistory.push(currentIndex);
    }
    let randomIndex;
    let attempts = 0;
    do {
        randomIndex = Math.floor(Math.random() * loadedUrls.length);
        attempts++;
    } while (playedIndicesHistory.includes(randomIndex) && attempts < 100);
    selectFile(randomIndex);
}

function navigateFile(direction) {
    if (document.getElementById('chk-shuf').checked && direction === 1) {
        executeShuffleStep();
        return;
    }
    const targetIndex = currentIndex + direction;
    if (targetIndex >= 0 && targetIndex < loadedUrls.length) {
        selectFile(targetIndex);
    }
}

function downloadActiveFile() {
    const txtView = document.getElementById('text-renderer');
    const copyBtn = document.getElementById('copy-btn'); // Kept ID to keep updateControlButtons working
    
    if (currentIndex === -1 || txtView.querySelector('.loading') || txtView.querySelector('.error')) return;

    // Grab the exact file name from your header title element
    const currentName = document.getElementById('current-title').innerText;
    
    // Grab the text contents exactly as they were loaded
    const rawData = txtView.textContent;
    
    // Create a plain text blob container for the file string data
    const blob = new Blob([rawData], { type: 'text/plain;charset=utf-8' });
    
    // Direct, native browser file download execution pipeline
    const downloadUrl = URL.createObjectURL(blob);
    const downloadAnchor = document.createElement('a');
    downloadAnchor.href = downloadUrl;
    downloadAnchor.download = currentName; // Automatically saves with your exact file name + extension
    
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    
    // Memory cleanup
    document.body.removeChild(downloadAnchor);
    URL.revokeObjectURL(downloadUrl);

    // Visual button success feedback state 
    const originalText = copyBtn.innerText;
    copyBtn.innerText = "✓ Downloaded!";
    copyBtn.style.background = "#28a745";
    setTimeout(() => {
        copyBtn.innerText = originalText;
        copyBtn.style.background = "";
    }, 1500);
}


// Helper utility engine to safely convert base64 bitstreams directly into operational asset Blobs
function base64ToBlob(base64, contentType) {
    const byteCharacters = atob(base64);
    const byteArrays = [];
    
    for (let offset = 0; offset < byteCharacters.length; offset += 512) {
        const slice = byteCharacters.slice(offset, offset + 512);
        const byteNumbers = new Array(slice.length);
        for (let i = 0; i < slice.length; i++) {
            byteNumbers[i] = slice.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        byteArrays.push(byteArray);
    }
    return new Blob(byteArrays, { type: contentType });
}

        // Reads a local .txt file list and populates the textbox automatically
        function loadLinksFromFile(inputElement) {
            const file = inputElement.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const textContent = e.target.result;
                // Inject the text file contents into the text area box
                document.getElementById('bulk-inputs').value = textContent;
                // Automatically render the file sidebar list links
                generateFileList();
            };
            
            reader.onerror = function() {

            };
            
            reader.readAsText(file);
        }

        // Prevents browser from opening the file and highlights the box
        function handleDragOver(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('bulk-inputs').classList.add('drag-hover');
        }

        // Removes highlight when file leaves the box area
        function handleDragLeave(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('bulk-inputs').classList.remove('drag-hover');
        }

        // Catches the dropped file, reads it, and loads the list
        function handleDrop(e) {
            e.preventDefault();
            e.stopPropagation();
            
            const textarea = document.getElementById('bulk-inputs');
            textarea.classList.remove('drag-hover');

            const dt = e.dataTransfer;
            const files = dt.files;

            if (files.length > 0) {
                const file = files[0];
                
                // Simple validation to ensure it's a text file
                if (file.name.endsWith('.txt') || file.type === "text/plain") {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        textarea.value = event.target.result;
                        generateFileList(); // Automatically load the sidebar links
                    };
                    reader.readAsText(file);
                } else {
                    alert("Please only drop raw text (.txt) files here.");
                }
            }
        }


// --- Keyboard Navigation & Media Controls ---
window.addEventListener('keydown', function(event) {
    if (document.activeElement === document.getElementById('bulk-inputs')) {
        return; 
    }

    const contentBox = document.getElementById('content-box');

switch (event.key) {
    case 'ArrowLeft':
        event.preventDefault();
        navigateFile(-1);
        break;
        
    case 'ArrowRight':
        event.preventDefault();
        navigateFile(+1);
        break;
        
    case ' ':
        event.preventDefault();
        const audioPlayer = document.getElementById('audio-element');
        const audioBox = document.getElementById('audio-container');

            if (audioPlayer.paused) {
                audioPlayer.play().catch(e => console.log("Playback blocked."));
            } else {
                audioPlayer.pause();
            }
        }
        break;
        
    case 'ArrowUp':
        event.preventDefault();
        // FIX: Scroll the active image box if it is visible, otherwise fallback to content box
        const imgBox = document.getElementById('image-container');
        if (imgBox && imgBox.style.display === "flex") {
            imgBox.scrollTop -= 40;
        } else {
            contentBox.scrollTop -= 40;
        }
        break;
        
    case 'ArrowDown':
        event.preventDefault();
        // FIX: Scroll the active image box if it is visible, otherwise fallback to content box
        const imgBoxDown = document.getElementById('image-container');
        if (imgBoxDown && imgBoxDown.style.display === "flex") {
            imgBoxDown.scrollTop += 40;
        } else {
            contentBox.scrollTop += 40;
        }
        break;
        
    default:
        return;
}
});


// Updated Notepad Module with Multi-Media Focus Restoration Fix & Both Mouse Buttons Click Hook
function initEscapeNotepad() {
    const style = document.createElement('style');
    style.textContent = `
        #workspace-notepad { 
            position: fixed; 
            top: -100%; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background: #ffffff; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            transition: top 0.3s ease-in-out; 
            display: flex; 
            flex-direction: column; 
            z-index: 10000; 
        } 
        #workspace-notepad.visible { 
            top: 0; 
        } 
        .notepad-menu-bar { 
            background: #f0f0f0; 
            padding: 6px 12px; 
            font-size: 13px; 
            font-family: sans-serif; 
            border-bottom: 1px solid #ccc; 
            color: #333; 
            user-select: none; 
        } 
        .notepad-text-input { 
            width: 100%; 
            height: 100%; 
            border: none; 
            padding: 15px; 
            font-family: "Courier New", Courier, monospace; 
            font-size: 16px; 
            resize: none; 
            box-sizing: border-box; 
            outline: none; 
            background: #ffffff; 
            color: #000000; 
        }
    `;
    document.head.appendChild(style);

    const workspaceNotepad = document.createElement('div');
    workspaceNotepad.id = 'workspace-notepad';
    workspaceNotepad.innerHTML = `
        <div class="notepad-menu-bar">Notepad (Press Esc/Insert/Left+Right Click to exit)</div>
        <textarea class="notepad-text-input" placeholder="Start typing..."></textarea>
    `;
    document.body.appendChild(workspaceNotepad);

    const textarea = workspaceNotepad.querySelector('.notepad-text-input');

    // Centralised toggle logic used by Keys and Mouse interactions
    function toggleNotepad() {
        workspaceNotepad.classList.toggle('visible');
        
        if (workspaceNotepad.classList.contains('visible')) {
            // Notepad opened: wait for slide transition, then focus text area
            setTimeout(() => {
                textarea.focus();
            }, 300);
        } else {
            // Notepad closed: remove focus from text input area
            textarea.blur();
            
            // Smart Focus Fallback Chain: Check what is active/visible on screen
            const imgBox = document.getElementById('image-container');
            const audioBox = document.getElementById('audio-container');
            const textBox = document.getElementById('text-renderer');

            if (imgBox && (imgBox.style.display === "flex" || imgBox.style.display === "block")) {
                imgBox.focus();
            } else if (audioBox && (audioBox.style.display === "flex" || audioBox.style.display === "block")) {
                audioBox.focus();
            } else if (textBox) {
                // Ensures the text panel or global layout accepts keyboard input
                textBox.focus();
            }

            // Ultimate fallback: refocus main body to keep global hotkeys alive
            document.body.focus();
        }
    }

    // Track active mouse button masks (1 = Left, 2 = Right)
    // Checking event.buttons detects if both are pressed simultaneously
    document.addEventListener('mousedown', function(event) {
        if ((event.buttons & 1) && (event.buttons & 2)) {
            event.preventDefault();
            event.stopPropagation();
            toggleNotepad();
        }
    }, true);

    // Suppress context menu popup when right-clicking while left-clicking
    document.addEventListener('contextmenu', function(event) {
        if (workspaceNotepad.classList.contains('visible')) {
            event.preventDefault();
        }
    }, true);

    // Global Key Listener using true capturing to intercept keys reliably
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape' || event.keyCode === 27 || event.key === 'Insert' || event.keyCode === 45) {
            event.preventDefault();
            event.stopPropagation();
            toggleNotepad();
        }
    }, true); 
}

// Run the function to activate it on this page

// --- Contextual Dynamic Image Viewer Control Engine ---
(function() {
    let currentScale = 1;
    const imgEl = document.getElementById('img-element');
    const imgBox = document.getElementById('image-container');
    const chkFitWidth = document.getElementById('chk-fit-width');

    if (imgEl && imgBox) {
        imgEl.style.transition = 'transform 0.1s ease-out, transform-origin 0.05s ease-out';
        imgEl.style.transformOrigin = 'center center';

        // 1. Mouse Wheel Zoom Mechanism
        imgBox.addEventListener('wheel', function(event) {
            if (imgBox.style.display !== "flex") return;
            
            // ABORT scroll wheel zoom if "Fit Width" is active
            if (chkFitWidth && chkFitWidth.checked) return;
            
            event.preventDefault(); // Stop the workspace canvas container from scrolling
            
            const rect = imgBox.getBoundingClientRect();
            const mouseX = ((event.clientX - rect.left) / rect.width) * 100;
            const mouseY = ((event.clientY - rect.top) / rect.height) * 100;
            
            imgEl.style.transformOrigin = `${mouseX}% ${mouseY}%`;

            const zoomIntensity = 0.15;
            if (event.deltaY < 0) {
                currentScale += zoomIntensity;
            } else {
                currentScale -= zoomIntensity;
            }

            currentScale = Math.max(1, Math.min(6, currentScale));
            imgEl.style.transform = `scale(${currentScale})`;
        }, { passive: false });

        // 2. Click Interaction Handler (Only resets manual zoom now)
        imgEl.addEventListener('click', function() {
            // If in fit width mode, clicks don't alter layout anymore since it stays locked
            if (chkFitWidth && chkFitWidth.checked) return;

            // Traditional mode: clicking resets scroll magnification instantly
            currentScale = 1;
            imgEl.style.transformOrigin = 'center center';
            imgEl.style.transform = 'scale(1)';
        });
        
        // 3. Automated State Change Handler (Instantly applies fit-width when checked)
        if (chkFitWidth) {
            chkFitWidth.addEventListener('change', updateImageDisplayMode);
        }

function updateImageDisplayMode() {
    currentScale = 1; 
    imgEl.style.transform = 'scale(1)';
    imgEl.style.transformOrigin = 'center center';
    
    // FIX: Force the image container back to the top when mode changes
    imgBox.scrollTop = 0; 

    if (chkFitWidth && chkFitWidth.checked) {
        imgEl.classList.add('fit-width-active');
        imgBox.style.overflow = 'auto'; 
        imgBox.style.justifyContent = 'flex-start';
    } else {
        imgEl.classList.remove('fit-width-active');
        imgBox.style.overflow = 'hidden';
        imgBox.style.justifyContent = 'center';
    }
}

const originalSelectFile = window.selectFile;
if (typeof originalSelectFile === 'function') {

        originalSelectFile(index);
        updateImageDisplayMode(); // Run this instantly without a 50ms delay
    };
}

window.addEventListener('mousedown', (event) => {
  // If the user is typing inside bulk inputs, ignore mouse shortcuts completely
  if (document.activeElement === document.getElementById('bulk-inputs')) {
    return;
  }

  const button = event.button; // 0 = Left, 2 = Right

  // Only track standard Left (0) and Right (2) clicks
  if (button !== 0 && button !== 2) return;

  // ONLY INTERCEPT ON A VALID DOUBLE CLICK
  if (event.detail === 2) {
    event.preventDefault();
    
    if (button === 0) {
      // Double Left Click -> Previous File
      navigateFile(-1);
      console.log('Double Left-click: Navigated to previous file.');
    } else {
      // Double Right Click -> Next File
      navigateFile(+1);
      console.log('Double Right-click: Navigated to next file.');
    }
  }
});

  // Ignore suppression if user is working inside bulk inputs

  event.preventDefault();
});
