<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Bloat-Free RC4 Compiler with Expiration</title>
<style>
body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; color: #333; }
.container { max-width: 650px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
textarea { width: 100%; font-family: monospace; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
input[type="text"], input[type="date"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 15px; }

/* Drag and Drop Zone Styles */
.drop-zone { border: 2px dashed #007bff; border-radius: 6px; padding: 25px; text-align: center; background: #f8fafd; cursor: pointer; margin-bottom: 15px; transition: background 0.2s; }
.drop-zone.dragover { background: #e6f0fa; border-color: #0056b3; }
.drop-zone p { margin: 0; font-size: 14px; color: #555; }
.drop-zone strong { color: #007bff; }

.btn-crypt { padding: 12px 20px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; background-color: #007bff; color: white; margin-bottom: 15px; }
.btn-crypt:hover { background-color: #0056b3; }

.output-actions { display: flex; gap: 10px; margin-top: 10px; }
.btn-action { flex: 1; padding: 10px; font-size: 13px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; }
.btn-copy { background-color: #28a745; }
.btn-copy:hover { background-color: #218838; }
.btn-dl { background-color: #17a2b8; }
.btn-dl:hover { background-color: #138496; }

.status-msg { text-align: center; color: #28a745; font-weight: bold; margin-top: 10px; display: block; }
.hidden { display: none; }
</style>
</head>
<body>

<div class="container">
<h2>Advanced RC4 Compiler & Gate Generator</h2>

<label><strong>1. Encryption Password Key:</strong></label><br>
<input type="text" id="cipherKey" placeholder="Enter password for the gate..."><br>

<label><strong>2. Set Expiration Date & Time (Optional):</strong></label><br>
<input type="datetime-local" id="expiryDate"><br>


<label><strong>3. Input Your Original Clean Script:</strong></label>
<!-- Drag & Drop Zone -->
<div id="dropZone" class="drop-zone">
<p>Drop your script file here, click to browse, or paste code below.</p>
<p><strong id="file-status">No file selected</strong></p>
<input type="file" id="fileInput" accept=".html,.js,.css,.txt" style="display: none;">
</div>

<!-- Text Area Input -->
<textarea id="inputCode" rows="8" placeholder="Or paste HTML, CSS, or JS code here..."></textarea>
<br><br>

<button class="btn-crypt" onclick="compileWorkflow()">Compile & Process Code</button>
<span id="status-message" class="status-msg hidden">✓ Action Complete!</span>

<!-- Output Section Structure -->
<div id="outputContainer" class="hidden">
<h3>Compiled HTML Code Output:</h3>
<textarea id="outputResult" rows="8" readonly placeholder="Output string will generate here..."></textarea>
<div class="output-actions">
<button class="btn-action btn-copy" onclick="copyToClipboard()">Copy to Clipboard</button>
<button class="btn-action btn-dl" onclick="downloadHTML()">Download File</button>
</div>
</div>
</div>

<script>
let globalActiveCode = "";
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const inputCodeTextarea = document.getElementById('inputCode');
const fileStatus = document.getElementById('file-status');

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => handleFileSelection(e.target.files[0]));

dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
});

dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) {
        handleFileSelection(e.dataTransfer.files[0]);
    }
});

function handleFileSelection(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        globalActiveCode = e.target.result;
        inputCodeTextarea.value = ""; 
        fileStatus.textContent = `Attached: ${file.name} (${Math.round(file.size / 1024)} KB)`;
    };
    reader.readAsText(file);
}

function rc4Cipher(key, str) {
    let s = [], j = 0, x, res = '';
    for (let i = 0; i < 256; i++) s[i] = i;
    for (let i = 0; i < 256; i++) {
        j = (j + s[i] + key.charCodeAt(i % key.length)) % 256;
        x = s[i]; s[i] = s[j]; s[j] = x;
    }
    let i = 0; j = 0;
    for (let y = 0; y < str.length; y++) {
        i = (i + 1) % 256;
        j = (j + s[i]) % 256;
        x = s[i]; s[i] = s[j]; s[j] = x;
        res += String.fromCharCode(str.charCodeAt(y) ^ s[(s[i] + s[j]) % 256]);
    }
    return res;
}








function compileWorkflow() {
    const key = document.getElementById('cipherKey').value;
    const expiryValue = document.getElementById('expiryDate').value; // Formatted as YYYY-MM-DD
    let targetRawCode = globalActiveCode.trim() ? globalActiveCode : inputCodeTextarea.value;

    if (!key) return alert("Please enter an encryption key!");
    if (!targetRawCode.trim()) return alert("Please paste code or drop a script file!");

    // 1. Convert the date into a flat Unix timestamp using a bulletproof string-parse approach
    let expiryTimestamp = 0;
    let obfuscatedDisplayString = "'No Expiration Set'";
    
    if (expiryValue) {
        // Parse the exact user-selected date and time to a millisecond timestamp
        expiryTimestamp = Date.parse(expiryValue);

        // Break down the value (Format: YYYY-MM-DDTHH:MM) into a cleaner presentation format
        const [rawDate, rawTime] = expiryValue.split("T");
        const dateParts = rawDate.split("-");
        
        // Final presentation layout text string: "DD/MM/YYYY at HH:MM"
        const formattedLocalString = dateParts[2] + "/" + dateParts[1] + "/" + dateParts[0] + " at " + rawTime;

        // Hide it by translating the layout text into ASCII numbers
        const charCodes = [];
        for (let i = 0; i < formattedLocalString.length; i++) {
            charCodes.push(formattedLocalString.charCodeAt(i));
        }
        obfuscatedDisplayString = `String.fromCharCode(${charCodes.join(',')})`;
    }


    // 2. Build the high-speed watchdog loop (Runs at a blistering 50ms interval rate)
    const enforcementPayload = `
(function() {
    const limit = ${expiryTimestamp};
    
    function securityWatchdog() {
        let violated = false;

        // Check A: True flat number chronological verification
        if (limit > 0 && new Date().getTime() > limit) {
            violated = true;
        }

        // Check B: Developer tools layout width verification
        if (window.outerWidth - window.innerWidth > 160 || window.outerHeight - window.innerHeight > 160) {
            violated = true;
        }

        // If rules are broken, force an immediate page reset back to the password overlay screen
        if (violated) {
            window.stop();             // Immediately kill any active asset rendering streams
            window.location.reload();  // Wipe the memory clean and force-return to the login gate layout
            throw new Error("Lock");   // Short-circuit the active tab execution thread
        }
    }
    // High frequency checking speed (50ms) to ensure near-instantaneous capture loops
    setInterval(securityWatchdog, 50);
    securityWatchdog(); 
})();
`;

    // 3. Sew the safety watchdog code directly to your original source script package
    if (targetRawCode.toLowerCase().includes('</body>')) {
        const injection = `<script>\n${enforcementPayload}\n<\/script>\n</body>`;
        targetRawCode = targetRawCode.replace(/<\/body>/i, injection);
    } else {
        targetRawCode = `${targetRawCode}\n\n${enforcementPayload}`;
    }

    // 4. Pass the combined script package elements through the RC4 encryption cycle
    const safeString = unescape(encodeURIComponent(targetRawCode));
    const encryptedBinary = rc4Cipher(key, safeString);
    const finalPayload = btoa(encryptedBinary);

    // 5. Generate the complete outer gate template setup
    const standaloneHTML = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Gate</title>
<style>
.login-overlay { font-family: Arial, sans-serif; position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; background: #f4f4f9 !important; display: flex !important; justify-content: center !important; align-items: center !important; z-index: 999999999 !important; }
.login-box { background: white !important; padding: 30px !important; border-radius: 8px !important; box-shadow: 0 4px 15px rgba(0,0,0,0.1) !important; text-align: center; width: 300px; }
</style>
</head>
<body>
<div id="lock-screen" class="login-overlay">
    <div class="login-box">
        <h2 style="margin-top:0; font-size: 22px;">Secure Authentication</h2>
        <div id="gate-controls">
            <p>Enter decryption key:</p>
            <input type="password" id="password-field" placeholder="Password..." style="padding: 10px; width: 85%; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 4px;"><br>
            <button onclick="verifyAndDecrypt()" style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; width: 93%; font-weight: bold;">Unlock Script</button>
        </div>
        <p id="expiry-notice" style="font-size: 13px; color: #666; margin-top: 15px; font-weight: normal;"></p>
        <p id="error-message" style="color: red; font-size: 14px; margin-top: 10px; font-weight: bold;"></p>
    </div>
</div>
<script>
const encryptedPayload = "${finalPayload}";

document.addEventListener("DOMContentLoaded", function() {
    const renderedDate = ${obfuscatedDisplayString};
    if(renderedDate !== "No Expiration Set") {
        document.getElementById('expiry-notice').innerHTML = "Expiration Limit: <strong style='color: red;'>" + renderedDate + "</strong>";
    } else {
        document.getElementById('expiry-notice').innerHTML = "Expiration Limit: <strong>" + renderedDate + "</strong>";
    }
});

function rc4Decrypt(k, str) {
    let s = [], j = 0, x, res = '';
    for (let i = 0; i < 256; i++) s[i] = i;
    for (let i = 0; i < 256; i++) { j = (j + s[i] + k.charCodeAt(i % k.length)) % 256; x = s[i]; s[i] = s[j]; s[j] = x; }
    let i = 0; j = 0;
    for (let y = 0; y < str.length; y++) { i = (i + 1) % 256; j = (j + s[i]) % 256; x = s[i]; s[i] = s[j]; s[j] = x; res += String.fromCharCode(str.charCodeAt(y) ^ s[(s[i] + s[j]) % 256]); }
    return res;
}

function verifyAndDecrypt() {
    const userKey = document.getElementById('password-field').value.trim();
    const errorDiv = document.getElementById('error-message');
    if (!userKey) { errorDiv.textContent = "Please enter a key."; return; }
    try {
        const encryptedBinary = atob(encryptedPayload);
        const unmasked = rc4Decrypt(userKey, encryptedBinary);
        const masterScriptContent = decodeURIComponent(escape(unmasked));
        if (!masterScriptContent || masterScriptContent.trim().length === 0) { throw new Error(); }
        
        document.getElementById('lock-screen').remove();
        document.open(); 
        document.write(masterScriptContent); 
        document.close();
    } catch (err) { 
        errorDiv.textContent = "Invalid password key. Decryption failed."; 
    }
}

document.getElementById('password-field').addEventListener('keypress', function(e) { if (e.key === 'Enter') verifyAndDecrypt(); });
<\/script>
</body>
</html>`;

    if (standaloneHTML.length > 50000000) {
        document.getElementById('outputContainer').classList.add('hidden');
        triggerDirectBlobDownload(standaloneHTML);
        showStatusMessage("✓ File Large! Direct Download Triggered.");
    } else {
        document.getElementById('outputResult').value = standaloneHTML;
        document.getElementById('outputContainer').classList.remove('hidden');
        showStatusMessage("✓ Compiled Successfully.");
    }
}

















function triggerDirectBlobDownload(content) {
    const blob = new Blob([content], { type: "text/html" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "secure-rc4-gate.html";
    a.click();


URL.revokeObjectURL(a.href);
}

function downloadHTML() {
const code = document.getElementById('outputResult').value;
if (code) triggerDirectBlobDownload(code);
}

function copyToClipboard() {
const outputText = document.getElementById('outputResult');
if (!outputText.value) return;
navigator.clipboard.writeText(outputText.value).then(() => {
showStatusMessage("✓ Copied to clipboard!");
});
}

function showStatusMessage(msg) {
const statusMsg = document.getElementById('status-message');
statusMsg.textContent = msg;
statusMsg.classList.remove('hidden');
setTimeout(() => statusMsg.classList.add('hidden'), 4000);
}










</script>
</body>
</html>
